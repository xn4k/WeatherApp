name: Collect weather model runs

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

concurrency:
  group: weather-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: isobar-7d8eb
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install collector dependencies
        working-directory: collector
        run: npm ci

      - name: Verify collector mathematics
        working-directory: collector
        run: npm test

      - name: Check collector syntax
        working-directory: collector
        run: npm run check

      - name: Report missing Firebase credentials
        if: env.FIREBASE_SERVICE_ACCOUNT_JSON == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON is missing; collection was verified but not published."

      - name: Collect and publish model runs
        if: env.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        working-directory: collector
        run: npm run collect
